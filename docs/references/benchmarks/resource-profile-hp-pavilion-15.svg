<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d">
<title id="t">Kallisto resource use against request rate</title>
<desc id="d">Two panels. CPU rises from 1.3 percent of one logical CPU idle to 216 percent saturated at 63,648 requests per second. Resident memory stays between 8.4 and 16.7 MiB.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; }
  .ink-2 { fill: #52514e; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #b9b8b2; stroke-width: 1; }
  .ref { stroke: #8a8984; stroke-width: 1; }
  .series { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  .dot-open { fill: #fcfcfb; stroke: #2a78d6; stroke-width: 2; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #ffffff; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #33332f; }
    .axis { stroke: #5c5b56; }
    .ref { stroke: #8a8984; }
    .series { stroke: #3987e5; }
    .dot { fill: #3987e5; stroke: #1a1a19; }
    .dot-open { fill: #1a1a19; stroke: #3987e5; }
  }
</style>
<rect class="surface" width="880" height="360" rx="8"/>
<text class="ink" x="64" y="40" font-size="14" font-weight="600">CPU</text>
<text class="ink-2" x="64" y="58" font-size="12">percent of one logical CPU, mean</text>
<line class="grid" x1="64" x2="424" y1="290.0" y2="290.0"/>
<text class="ink-2" x="56" y="294.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="64" x2="424" y1="246.0" y2="246.0"/>
<text class="ink-2" x="56" y="250.0" font-size="11" text-anchor="end">50</text>
<line class="grid" x1="64" x2="424" y1="202.0" y2="202.0"/>
<text class="ink-2" x="56" y="206.0" font-size="11" text-anchor="end">100</text>
<line class="grid" x1="64" x2="424" y1="158.0" y2="158.0"/>
<text class="ink-2" x="56" y="162.0" font-size="11" text-anchor="end">150</text>
<line class="grid" x1="64" x2="424" y1="114.0" y2="114.0"/>
<text class="ink-2" x="56" y="118.0" font-size="11" text-anchor="end">200</text>
<line class="grid" x1="64" x2="424" y1="70.0" y2="70.0"/>
<text class="ink-2" x="56" y="74.0" font-size="11" text-anchor="end">250</text>
<text class="ink-2" x="64.0" y="308" font-size="11" text-anchor="middle">0</text>
<text class="ink-2" x="166.9" y="308" font-size="11" text-anchor="middle">20k</text>
<text class="ink-2" x="269.7" y="308" font-size="11" text-anchor="middle">40k</text>
<text class="ink-2" x="372.6" y="308" font-size="11" text-anchor="middle">60k</text>
<line class="axis" x1="64" x2="424" y1="290.0" y2="290.0"/>
<text class="ink-2" x="244.0" y="328" font-size="12" text-anchor="middle">requests per second</text>
<line class="ref" x1="64" x2="424" y1="114.0" y2="114.0"/>
<text class="ink-2" x="68" y="109.0" font-size="11">200% = both worker CPUs busy</text>
<polyline class="series" points="64.0,288.9 69.1,277.7 89.6,248.5 115.2,215.9 164.9,190.5 215.4,186.6 265.8,173.5 320.1,150.4 371.3,127.2"/>
<circle class="dot" cx="64.0" cy="288.9" r="4"><title>0 req/s: 1.3</title></circle>
<circle class="dot" cx="69.1" cy="277.7" r="4"><title>982 req/s: 14.0</title></circle>
<circle class="dot" cx="89.6" cy="248.5" r="4"><title>4,981 req/s: 47.2</title></circle>
<circle class="dot" cx="115.2" cy="215.9" r="4"><title>9,960 req/s: 84.2</title></circle>
<circle class="dot" cx="164.9" cy="190.5" r="4"><title>19,623 req/s: 113.1</title></circle>
<circle class="dot" cx="215.4" cy="186.6" r="4"><title>29,434 req/s: 117.5</title></circle>
<circle class="dot" cx="265.8" cy="173.5" r="4"><title>39,247 req/s: 132.4</title></circle>
<circle class="dot" cx="320.1" cy="150.4" r="4"><title>49,793 req/s: 158.6</title></circle>
<circle class="dot" cx="371.3" cy="127.2" r="4"><title>59,752 req/s: 185.0</title></circle>
<circle class="dot-open" cx="391.3" cy="100.1" r="5"><title>saturated, 63,648 req/s: 215.8</title></circle>
<text class="ink" x="78.0" y="286.0" font-size="11">idle 1.3%</text>
<text class="ink" x="383.3" y="90.1" font-size="11" text-anchor="end">saturated 215.8%</text>
<text class="ink" x="514" y="40" font-size="14" font-weight="600">Memory</text>
<text class="ink-2" x="514" y="58" font-size="12">resident set (RSS), MiB, peak</text>
<line class="grid" x1="514" x2="874" y1="290.0" y2="290.0"/>
<text class="ink-2" x="506" y="294.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="514" x2="874" y1="235.0" y2="235.0"/>
<text class="ink-2" x="506" y="239.0" font-size="11" text-anchor="end">5</text>
<line class="grid" x1="514" x2="874" y1="180.0" y2="180.0"/>
<text class="ink-2" x="506" y="184.0" font-size="11" text-anchor="end">10</text>
<line class="grid" x1="514" x2="874" y1="125.0" y2="125.0"/>
<text class="ink-2" x="506" y="129.0" font-size="11" text-anchor="end">15</text>
<line class="grid" x1="514" x2="874" y1="70.0" y2="70.0"/>
<text class="ink-2" x="506" y="74.0" font-size="11" text-anchor="end">20</text>
<text class="ink-2" x="514.0" y="308" font-size="11" text-anchor="middle">0</text>
<text class="ink-2" x="616.9" y="308" font-size="11" text-anchor="middle">20k</text>
<text class="ink-2" x="719.7" y="308" font-size="11" text-anchor="middle">40k</text>
<text class="ink-2" x="822.6" y="308" font-size="11" text-anchor="middle">60k</text>
<line class="axis" x1="514" x2="874" y1="290.0" y2="290.0"/>
<text class="ink-2" x="694.0" y="328" font-size="12" text-anchor="middle">requests per second</text>
<polyline class="series" points="514.0,197.7 519.1,162.9 539.6,156.1 565.2,158.8 614.9,164.0 665.4,160.7 715.8,160.3 770.1,159.5 821.3,158.5"/>
<circle class="dot" cx="514.0" cy="197.7" r="4"><title>0 req/s: 8.4</title></circle>
<circle class="dot" cx="519.1" cy="162.9" r="4"><title>982 req/s: 11.6</title></circle>
<circle class="dot" cx="539.6" cy="156.1" r="4"><title>4,981 req/s: 12.2</title></circle>
<circle class="dot" cx="565.2" cy="158.8" r="4"><title>9,960 req/s: 11.9</title></circle>
<circle class="dot" cx="614.9" cy="164.0" r="4"><title>19,623 req/s: 11.5</title></circle>
<circle class="dot" cx="665.4" cy="160.7" r="4"><title>29,434 req/s: 11.8</title></circle>
<circle class="dot" cx="715.8" cy="160.3" r="4"><title>39,247 req/s: 11.8</title></circle>
<circle class="dot" cx="770.1" cy="159.5" r="4"><title>49,793 req/s: 11.9</title></circle>
<circle class="dot" cx="821.3" cy="158.5" r="4"><title>59,752 req/s: 12.0</title></circle>
<circle class="dot-open" cx="841.3" cy="106.6" r="5"><title>saturated, 63,648 req/s: 16.7</title></circle>
<text class="ink" x="528.0" y="211.7" font-size="11">idle 8.4 MiB</text>
<text class="ink" x="833.3" y="96.6" font-size="11" text-anchor="end">saturated 16.7 MiB</text>
<text class="ink-2" x="64" y="346" font-size="11">Filled points: wrk2 at a fixed rate, 100 connections. Open point: wrk, 256 connections, as fast as it goes. Median of 3 runs.</text>
</svg>
