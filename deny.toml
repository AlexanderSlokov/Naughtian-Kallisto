# Derived from tikv/tikv (https://github.com/tikv/tikv), Copyright The TiKV
# Authors, licensed under Apache-2.0. Upstream revision 1ef0a19 (2026-08-25).
# Modified for Naughtian Kallisto. See THIRD-PARTY-NOTICES.md.

# To comply with FIPS 140-2, we should not use crypto algorithms implemented in
# rust, instead we should delegate these operation to OpenSSL, including
# symmetric encryption, asymmetric encryption, hash functions,
# key establishment, digital signatures and random number generators.
[bans]
deny = [
    # Hash functions
    # We allow md5 for AWS S3 object lock feature which requires
    # computting object's md5.
    { name = "md5" },
    { name = "md-5"},
    # time 0.2 pulls sha1 through stdweb's proc-macro on wasm-only targets.
    { name = "sha1"},
    { name = "sha-1" },
    { name = "sha2" },
    { name = "sha3" },
    # Symmetric encryption
    { name = "aes" },
    { name = "aes-gcm" },
    { name = "aes-gcm-siv" },
    { name = "chacha20poly1305" },
    # google-cloud-gax pulls rand 0.10, which currently reaches chacha20.
    { name = "chacha20" },
    # Asymmetric encryption
    { name = "elliptic-curves" },
    { name = "rsa" },
    # Digital signatures
    { name = "dsa" },
    { name = "ecdsa" },
    { name = "ed25519" },
    # Message authentication codes
    { name = "hmac"},
    # `rustls` and `ring` were on this list upstream because TiKV prefers system
    # native TLS or OpenSSL. Kallisto removed them in ADR-0015/ADR-0016 (plan
    # "duck", 2026-09-17). Three reasons, in order of weight:
    #
    #  1. Kallisto must fetch its sealed secret file over HTTPS from an
    #     S3-compatible bucket (ADR-0015 D2), so it needs TLS in-process. Linking
    #     OpenSSL would put a C library back in the way of the static musl binary
    #     and the few-MB distroless image that ADR-0015 D12 exists to produce.
    #  2. rustls 0.23 defaults to the aws-lc-rs provider, which wraps AWS-LC — the
    #     same module that carries the FIPS 140-3 validation. So this is not the
    #     "unvalidated pure-Rust crypto" the rest of this list guards against; the
    #     upstream comment two lines above already names aws-lc-rs as the FIPS path.
    #  3. Because aws-lc-rs is in the tree for TLS regardless, ADR-0015 D13's
    #     encryption barrier uses `aws_lc_rs::aead::AES_256_GCM` and D15's keyed
    #     hashing uses `aws_lc_rs::hmac`. That adds no dependency, and it is why
    #     `aes-gcm`, `hmac`, `sha2` and friends stay banned below — Kallisto does
    #     not need them.
    #
    # Everything else on this list is inherited unchanged and still applies.
    # Ban trait crates from RustCrypto.
    { name = "aead" },
    { name = "cipher" },
    # aws-smithy-checksums reaches digest through crc-fast in newer releases.
    { name = "digest" },
    { name = "password-hash" },
    { name = "signature" },
]
multiple-versions = "allow"

[advisories]
version = 2
yanked = "deny"
unmaintained = 'workspace'
# Empty, and it stays that way.
#
# This list used to carry the rkyv 0.7 advisory, which ADR-0013 recorded as a
# data-migration problem: the archives were on disk, so fixing it meant a
# format change. ADR-0015 D12 said the dependency was not worth its cost, and
# deleting the engine deleted the advisory with it — the migration turned into
# a line removed from this file.
ignore = []

# Kallisto is licensed under AGPL-3.0-or-later. The allow-list below is the set
# of licenses that can be combined into an AGPL work without adding obligations
# we cannot meet: permissive licenses, plus MPL-2.0 (file-level copyleft) and
# AGPL itself. It follows the ASF Category A grouping, which is a convenient
# ready-made list of such licenses, not because Kallisto is an ASF project.
# See https://www.apache.org/legal/resolved.html.
[licenses]
version = 2
private = { ignore = false }
# Allow licenses in Category A
# CDLA-Permissive-2.0 covers webpki-roots, which is Mozilla's CA root bundle
# rather than code. It is a permissive *data* licence: no copyleft, no
# attribution obligation on downstream recipients, so it combines into an
# AGPL work on the same terms as the rest of this list.
# MPL-2.0 was dropped when the storage engine went: nothing in the tree carries
# it any more, and an allowance for a licence no dependency uses is an
# allowance nobody will notice being used later.
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "AGPL-3.0-or-later", "Unicode-3.0", "CDLA-Permissive-2.0"]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
