# Config for SonarQube Cloud *Automatic Analysis*.
# Automatic Analysis ignores sonar-project.properties (that file is only read by
# the CI-based scanner), so the scope has to be repeated here.

sonar.sources=src,cmd,components
sonar.tests=tests,benchmarks

sonar.exclusions=target/**,docs/**,**/*.md,**/*.json,**/*.toml,coverage_report/**
