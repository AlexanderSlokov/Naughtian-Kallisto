avoid-breaking-exported-api = false

# Worker runtimes are built in src/event/worker.rs, which names each thread and
# pins it to a core with core_affinity before the runtime starts. A start hook
# registered here runs inside the runtime instead, so it cannot participate in
# that setup and silently diverges from the thread-per-core layout the data
# plane depends on. Put the logic in the worker spawn path.
[[disallowed-methods]]
path = "tokio::runtime::builder::Builder::on_thread_start"
reason = """
Worker threads are set up in src/event/worker.rs (naming plus core_affinity
pinning). Register startup work there, not as a runtime hook.
"""
[[disallowed-methods]]
path = "tokio::runtime::builder::Builder::on_thread_stop"
reason = """
Worker thread teardown belongs in src/event/worker.rs alongside the spawn path,
so setup and teardown stay in one place.
"""

