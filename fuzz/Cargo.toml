[package]
name = "naughtian-kallisto-fuzz"
version = "0.0.1"
publish = false
edition = "2024"

# Keeps this crate out of the root workspace. Without it every cargo invocation
# inside fuzz/ fails with "current package believes it's in a workspace when
# it's not" — which is what made `make fuzz` and the CI fuzz-build step
# unrunnable.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
core_crypto = { path = "../components/kallisto_crypto" }
serde_json = "1.0"
naughtian-kallisto = { path = "..", features = ["fuzzing"] }
axum = "0.7"

[[bin]]
name = "read_path"
path = "fuzz_targets/read_path.rs"
test = false
doc = false

[[bin]]
name = "sealed_file"
path = "fuzz_targets/sealed_file.rs"
test = false
doc = false
