[package]
name = "naughtian-kallisto-fuzz"
version = "0.0.1"
publish = false
edition = "2024"

# Keeps this crate out of the root workspace. Without it every cargo invocation
# inside fuzz/ fails with "current package believes it's in a workspace when
# it's not" — which is what made `make fuzz` and the CI fuzz-build step
# unrunnable.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
rkyv = "0.7"
sonic-rs = "0.3"
naughtian-kallisto = { path = "..", features = ["fuzzing"] }
axum = "0.7"

[[bin]]
name = "rkyv_roundtrip"
path = "fuzz_targets/rkyv_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "http_parser"
path = "fuzz_targets/http_parser.rs"
test = false
doc = false
