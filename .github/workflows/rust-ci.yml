name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-lint:
    name: Check & Lint (Fmt, Clippy, Deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Install OS dependencies for building librocksdb-sys and others
      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Install OS dependencies for building librocksdb-sys and others
      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --workspace
