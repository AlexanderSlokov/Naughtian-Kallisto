name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-lint:
    name: Check & Lint (Fmt, Clippy, Deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain comes from rust-toolchain.toml so there is exactly one
      # place to change it. It cannot be left out: this action derives the
      # toolchain from its own ref, and pinning the action to a SHA (which the
      # supply-chain policy requires) leaves it with nothing to derive from —
      # the job then dies with "'toolchain' is a required input" before a line
      # of Rust is compiled.
      #
      # It has to be that exact nightly, not stable: rustfmt.toml sets
      # `unstable_features = true` and ten nightly-only options. On stable
      # rustfmt ignores them with a warning and exits 0, so a stable CI would
      # pass while formatting drifted from what every developer produces.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Using $channel (from rust-toolchain.toml)"

      - name: Install minimal stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # cmake and clang are for aws-lc-rs, the only native build dependency left
      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: ./scripts/clippy

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain comes from rust-toolchain.toml so there is exactly one
      # place to change it. It cannot be left out: this action derives the
      # toolchain from its own ref, and pinning the action to a SHA (which the
      # supply-chain policy requires) leaves it with nothing to derive from —
      # the job then dies with "'toolchain' is a required input" before a line
      # of Rust is compiled.
      #
      # It has to be that exact nightly, not stable: rustfmt.toml sets
      # `unstable_features = true` and ten nightly-only options. On stable
      # rustfmt ignores them with a warning and exits 0, so a stable CI would
      # pass while formatting drifted from what every developer produces.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Using $channel (from rust-toolchain.toml)"

      - name: Install minimal stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # cmake and clang are for aws-lc-rs, the only native build dependency left
      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Tests
        run: cargo test --workspace

  verify:
    name: Verify (Miri & Proptest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-x86_64-unknown-linux-gnu
          components: miri, rust-src

      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # BLOCKING, per ADR-0013 §5: miri + proptest + security invariants.
      # loom, fuzz and mutants run on a schedule in
      # verification-scheduled.yml — a slow job on the PR path is how a
      # verification suite gets disabled.
      - name: Run make verify
        run: make verify

