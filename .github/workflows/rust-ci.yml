name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-lint:
    name: Check & Lint (Fmt, Clippy, Deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimal stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          components: rustfmt, clippy

      # cmake and clang are for aws-lc-rs, the only native build dependency left
      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: ./scripts/clippy

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimal stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1

      # cmake and clang are for aws-lc-rs, the only native build dependency left
      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Tests
        run: cargo test --workspace

  verify:
    name: Verify (Miri & Proptest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-x86_64-unknown-linux-gnu
          components: miri, rust-src

      - name: Install OS dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # BLOCKING, per ADR-0013 §5: miri + proptest + security invariants.
      # loom, fuzz and mutants run on a schedule in
      # verification-scheduled.yml — a slow job on the PR path is how a
      # verification suite gets disabled.
      - name: Run make verify
        run: make verify

