name: Docker Build and Publish Alpha build for Nauhgtian Kallisto

on:
  push:
    branches: [ "1.0.0-alpha" ]
    # Build on semantic release tags like v1.0.0
    tags: [ 'v*.*.*-alpha' ]
    paths-ignore:
      - '**.md'
      - '../../docs/**'
      - 'LICENSE'
  # Manual trigger from Actions
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME: <github_username>/<repo_name> (e.g. AlexanderSlokov/kallisto)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Convert to lowercase to fix Docker tag invalid format error
      - name: Lowercase REGISTRY
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # Setup Docker Buildx to allow cross-architecture builds if needed
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Login to GHCR (GitHub Container Registry)
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.0.0-alpha

      # Build the specialized tester image and load it locally for testing
      - name: Build tester image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: tester
          load: true
          tags: kallisto-tester:1.0.0-alpha
          cache-from: type=gha,scope=tester
          cache-to: type=gha,mode=max,scope=tester

      # Push tester image to registry
      - name: Push tester image
        if: github.event_name != 'pull_request'
        run: |
          docker tag kallisto-tester:1.0.0-alpha ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.0-alpha-tester
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.0.0-alpha-tester

      # Build & Push the production Server Image
      - name: Build and push Production Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # This saves massive time on huge Rust builds by caching the cargo/rocksdb-sys compilation steps
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
