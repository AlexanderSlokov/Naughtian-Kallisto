# Seals secrets.v<N>.json and uploads it as the one object the fleet polls.
# A template: publish() in lib.sh fills in the three placeholders.
#
#   __VERSION__           which secrets.v<N>.json to seal
#   __SEAL_KEY_SECRET__   the Secret holding the seal key; act 3 seals with a wrong one
#   __REWRITE_VERSION__   empty, or a version number to write over the sealed file's
#                         header before upload; act 3 uses it to tamper with a file
#
# Two steps in one pod, with nothing built: the production image is distroless,
# so kallisto-ctl runs on its own as an init container and writes the sealed
# file to a shared emptyDir; rclone then uploads it. up.sh has already created
# the bucket and the key.
apiVersion: batch/v1
kind: Job
metadata:
  name: publish-file
  namespace: kallisto-demo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
        - name: seal
          image: ghcr.io/alexanderslokov/naughtian-kallisto:2.0.2
          command:
            - /usr/local/bin/kallisto-ctl
            - seal
            - --in
            - /plain/secrets.json
            - --out
            - /out/demo.kal
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          env:
            - name: KALLISTO_SEAL_KEY
              valueFrom:
                secretKeyRef: { name: __SEAL_KEY_SECRET__, key: KALLISTO_SEAL_KEY }
          volumeMounts:
            - { name: plain, mountPath: /plain, readOnly: true }
            - { name: out, mountPath: /out }
      containers:
        - name: upload
          image: rclone/rclone:1.71
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              file=/out/demo.kal
              if [ -n "$REWRITE_VERSION" ]; then
                # The header is "KALLISTO", one format byte, then the content
                # version as a little-endian u64 at offset 9. Only the low byte
                # is rewritten, which is enough for the versions used here.
                cp /out/demo.kal /tmp/demo.kal && file=/tmp/demo.kal
                printf "$(printf '\\%03o' "$REWRITE_VERSION")" |
                  dd of="$file" bs=1 seek=9 conv=notrunc 2>/dev/null
              fi
              rclone copyto -v "$file" :s3:kallisto-demo/demo.kal
          env:
            - { name: REWRITE_VERSION, value: "__REWRITE_VERSION__" }
            - { name: RCLONE_S3_PROVIDER, value: Other }
            - { name: RCLONE_S3_ENDPOINT, value: "http://garage:3900" }
            - { name: RCLONE_S3_REGION, value: us-east-1 }
            - { name: RCLONE_S3_FORCE_PATH_STYLE, value: "true" }
            # The bucket exists already; rclone would otherwise try to create it.
            - { name: RCLONE_S3_NO_CHECK_BUCKET, value: "true" }
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: demo-credentials, key: KALLISTO_S3_ACCESS_KEY_ID }
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: demo-credentials, key: KALLISTO_S3_SECRET_ACCESS_KEY }
          volumeMounts:
            - { name: out, mountPath: /out, readOnly: true }
      volumes:
        - name: plain
          configMap:
            name: plain-v__VERSION__
        - name: out
          emptyDir: {}
