# Twenty pods, each an app plus its own Kallisto, the sidecar shape of ADR-0015.
#
# The app is the stock Vault CLI pointed at 127.0.0.1:8200. It has no idea it
# is not talking to Vault. Every two seconds it prints one line:
#
#   20:51:07 file=v1 password=v1-password-not-a-real-credential
#
# so `kubectl logs` (or `l` in k9s) on any pod shows the moment it changes.
#
# Kallisto is a native sidecar (an init container with restartPolicy: Always),
# so it starts before the app and lives as long as the pod.
#
# The three probes are exec probes that run kallisto-ctl, which is in the image.
# Nothing else reaches Kallisto: it listens on loopback only, the kubelet sends
# httpGet and tcpSocket probes to the pod IP, and the image is distroless, so
# there is no shell or HTTP client to exec (issue #60). kallisto-ctl finds the
# port through KALLISTO_CONFIG, the same variable the server reads.
#
#   startup    `health`          the app container starts once Kallisto answers
#   readiness  `health --ready`  the pod is Ready only while a file is loaded
#   liveness   `health`          a Kallisto that stops answering is restarted
#
# Startup is not `--ready` on purpose. A failed startup probe restarts the
# container, and a Kallisto with no file and no bucket is not helped by a
# restart: it would loop, and the pod would never get past Init.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kallisto-config
  namespace: kallisto-demo
data:
  kallisto.yaml: |
    apiVersion: kallisto/v1
    kind: Resolver
    spec:
      listen:
        address: 127.0.0.1
        port: 8200
      workers: 1
      mount: secret
      source:
        type: bucket
        endpoint: http://garage.kallisto-demo.svc.cluster.local:3900
        bucket: kallisto-demo
        objectKey: demo.kal
        region: us-east-1
        pathStyle: true
      refresh:
        intervalSeconds: 5
      cacheDir: /var/lib/kallisto
      log:
        enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet
  namespace: kallisto-demo
spec:
  replicas: 20
  selector:
    matchLabels: { app: fleet }
  template:
    metadata:
      labels: { app: fleet }
    spec:
      # Nothing in the pod talks to the API server, least of all the process
      # holding the secrets.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The cache emptyDir is created root-owned; this hands it to the
        # nonroot user, which the compose demo needs a whole extra container for.
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: kallisto
          # 2.1.0 is the first release whose kallisto-ctl has `health`.
          image: ghcr.io/alexanderslokov/naughtian-kallisto:2.1.0
          restartPolicy: Always
          env:
            - { name: KALLISTO_CONFIG, value: /etc/kallisto/kallisto.yaml }
            - name: KALLISTO_SEAL_KEY
              valueFrom:
                secretKeyRef: { name: demo-credentials, key: KALLISTO_SEAL_KEY }
            - name: KALLISTO_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: demo-credentials, key: KALLISTO_S3_ACCESS_KEY_ID }
            - name: KALLISTO_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: demo-credentials, key: KALLISTO_S3_SECRET_ACCESS_KEY }
          startupProbe:
            exec: { command: ["/usr/local/bin/kallisto-ctl", "health"] }
            periodSeconds: 1
            failureThreshold: 30
          # An exec probe is not free: each one starts a process inside the
          # container, about 45 ms of CPU on the demo machine. At a 2 s and a
          # 10 s period an idle sidecar went from about 1 millicore to 27. The
          # periods below are as long as the demo allows: a file cannot arrive
          # faster than the 5 s poll, so readiness need not be asked faster.
          readinessProbe:
            exec: { command: ["/usr/local/bin/kallisto-ctl", "health", "--ready"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["/usr/local/bin/kallisto-ctl", "health"] }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/kallisto, readOnly: true }
            - { name: cache, mountPath: /var/lib/kallisto }
      containers:
        - name: app
          image: hashicorp/vault:1.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                file=$(wget -qO- http://127.0.0.1:8200/v1/sys/health 2>/dev/null \
                  | sed -n 's/.*"kallisto_file_version":\([0-9]*\).*/\1/p')
                password=$(vault kv get -field=password secret/app/database 2>&1 | tail -n 1)
                echo "$(date +%T) file=v${file:-?} password=${password}"
                sleep 2
              done
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: kallisto-config }
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Nothing connects through this Service: the app is a shell loop with no
# listener. It is here so that the cluster shows which pods it would route to.
# A pod whose Kallisto holds no file is not Ready and gets no endpoint
# (experiment 2, step 3).
apiVersion: v1
kind: Service
metadata:
  name: fleet
  namespace: kallisto-demo
spec:
  selector: { app: fleet }
  ports:
    - { name: app, port: 80 }
