# Kallisto demo — docker compose up and done.
#
# From repo root:
#   docker compose -f demo/docker-compose.demo.yml --env-file demo/.env.demo up
#
# From demo/:
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up
#
# After ~20s:
#   Health     : curl http://127.0.0.1:8200/v1/sys/health
#   Read secret: curl http://127.0.0.1:8200/v1/secret/data/app/database
#
# Credentials in .env.demo are deliberately fake placeholders committed on
# purpose — the seal key is thirty-two zero bytes. Do not use them anywhere.
#
# REQUIRES LINUX. Every service below uses network_mode: host, because Kallisto
# refuses to bind anything but loopback and a container's own loopback is not
# reachable from the host. Docker Desktop on macOS and Windows does not provide
# host networking the same way; see "Running without host networking" in
# README.md for what would have to change.

# Every image is pinned to a version. This file used to pull MinIO's `latest`,
# and broke when MinIO stopped publishing images (issue #61).

services:
  # The bucket. Garage, S3 API on 127.0.0.1:3900. The image is the bare binary,
  # so the healthcheck is Garage asking itself for its status.
  garage:
    image: dxflrs/garage:v2.4.1
    network_mode: host
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Waits for Garage, gives it a layout, the demo key and the bucket, seals
  # plain.demo.json and uploads demo.kal. Kallisto starts only after this
  # exits 0.
  kallisto-init:
    build:
      context: ..
      dockerfile: demo/Dockerfile.demo
      target: init
    network_mode: host
    depends_on:
      garage:
        condition: service_healthy
    environment:
      KALLISTO_SEAL_KEY: ${KALLISTO_SEAL_KEY}
      KALLISTO_S3_ACCESS_KEY_ID: ${KALLISTO_S3_ACCESS_KEY_ID}
      KALLISTO_S3_SECRET_ACCESS_KEY: ${KALLISTO_S3_SECRET_ACCESS_KEY}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      BUCKET: kallisto-demo
      OBJECT: demo.kal
      # An rclone remote named "demo", so that `rclone ... demo:` works in this
      # container without a configuration file.
      RCLONE_CONFIG_DEMO_TYPE: s3
      RCLONE_CONFIG_DEMO_PROVIDER: Other
      RCLONE_CONFIG_DEMO_ENDPOINT: http://127.0.0.1:3900
      RCLONE_CONFIG_DEMO_REGION: us-east-1
      RCLONE_CONFIG_DEMO_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_DEMO_ACCESS_KEY_ID: ${KALLISTO_S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_DEMO_SECRET_ACCESS_KEY: ${KALLISTO_S3_SECRET_ACCESS_KEY}
      # The bucket exists already; rclone would otherwise try to create it.
      RCLONE_CONFIG_DEMO_NO_CHECK_BUCKET: "true"
    volumes:
      - ./plain.demo.json:/demo/plain.demo.json:ro
      # The Garage CLI finds its node through the same configuration and the
      # node's key, which is in the metadata directory.
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
      # Chowned to Kallisto's uid by the init script.
      - kallisto-cache:/var/lib/kallisto
    restart: "no"

  kallisto:
    image: ghcr.io/alexanderslokov/naughtian-kallisto:2.1.0
    network_mode: host
    depends_on:
      kallisto-init:
        condition: service_completed_successfully
    volumes:
      - ./kallisto.demo.yaml:/etc/kallisto/kallisto.yaml:ro
      - kallisto-cache:/var/lib/kallisto
    environment:
      KALLISTO_SEAL_KEY: ${KALLISTO_SEAL_KEY}
      KALLISTO_CONFIG: /etc/kallisto/kallisto.yaml
      KALLISTO_S3_ACCESS_KEY_ID: ${KALLISTO_S3_ACCESS_KEY_ID}
      KALLISTO_S3_SECRET_ACCESS_KEY: ${KALLISTO_S3_SECRET_ACCESS_KEY}
      KALLISTO_CACHE_DIR: /var/lib/kallisto
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # mlock for the barrier key.
    ulimits:
      memlock: -1
    # The image is distroless: kallisto-ctl is the only thing in it that can ask.
    healthcheck:
      test: ["CMD", "/usr/local/bin/kallisto-ctl", "health", "--ready"]
      # Each check is a line in the access log, so not often.
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  garage-data:
  kallisto-cache:
